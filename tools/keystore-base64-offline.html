<!doctype html>
<html lang="zh-CN"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>本机离线 keystore 转换</title>
<style>body{font-family:system-ui;max-width:40rem;margin:auto;padding:1.2rem;color:#172239;background:#f5f7fb}button,input,textarea{font:inherit;margin:.6rem 0;box-sizing:border-box;width:100%}button{min-height:48px}textarea{height:12rem;overflow-wrap:anywhere}p{line-height:1.6}</style>
<h1>本机离线 keystore 转换</h1>
<p>请先下载并审查本文件，在手机本地浏览器打开后断网使用。此工具仅把你选择的文件转换为 Base64，不验签、不读取密码、不上传文件。不要把输出发送到聊天、Issue、PR 或在线转换网站。</p>
<input id="file" type="file" aria-label="选择既有 keystore 文件">
<p id="status" role="status">尚未选择文件。</p>
<textarea id="result" readonly aria-label="仅供复制到 GitHub Actions Secret 的 Base64"></textarea>
<button id="copy" disabled>复制到剪贴板</button>
<button id="clear">清除本页内容</button>
<p>只在 GitHub 仓库 Settings → Secrets and variables → Actions → New repository secret 中粘贴到 TRADE_REVIEW_KEYSTORE_BASE64。使用完毕清除此页和剪贴板，保留原 keystore 的安全副本。</p>
<script>
const file=document.getElementById('file'),result=document.getElementById('result'),status=document.getElementById('status'),copy=document.getElementById('copy');
let revision=0;
function clear(){revision++;file.value='';result.value='';copy.disabled=true;status.textContent='已清除本页内容。';}
file.addEventListener('change',()=>{
  const selected=file.files[0],current=++revision;result.value='';copy.disabled=true;
  if(!selected){status.textContent='尚未选择文件。';return;}
  if(selected.size===0||selected.size>32*1024){status.textContent='文件为空或超过 32 KiB（需满足 GitHub Secret 大小限制），请核对既有 keystore。';return;}
  const reader=new FileReader();status.textContent='正在本机读取；不连接网络。';
  reader.onload=()=>{if(current!==revision)return;const text=String(reader.result),index=text.indexOf(',');if(index<0){status.textContent='无法转换。';return;}result.value=text.slice(index+1);copy.disabled=false;status.textContent='已在本机转换，请只复制到 GitHub Secret。';};
  reader.onerror=()=>{if(current===revision)status.textContent='无法读取文件，请重新选择。';};reader.readAsDataURL(selected);
});
copy.addEventListener('click',async()=>{result.select();try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(result.value);else if(!document.execCommand('copy'))throw Error();status.textContent='已复制，请只粘贴到指定 Secret。';}catch{status.textContent='浏览器禁止自动复制，请长按文本选择并复制。';}});
document.getElementById('clear').addEventListener('click',clear);window.addEventListener('pagehide',clear);
</script></html>
