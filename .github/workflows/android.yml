name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      signed_apk_blob_sha:
        description: 'Optional public fixed-signed APK Git blob; payload and signer must match this build and committed pin'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: android-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Debug APK, unit tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      - name: Generate official wrapper when absent
        if: ${{ hashFiles('gradle/wrapper/gradle-wrapper.jar') == '' }}
        run: bash scripts/generate-wrapper.sh
      - name: Validate official wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Test signature publication guards without private keys
        run: |
          python3 scripts/tests/test_signing_guard.py
          python3 scripts/tests/test_signing_config.py
          python3 scripts/tests/test_signed_payload.py
          python3 scripts/tests/test_device_delivery.py
      - name: Configure fixed V0.3 signing key from Secrets when available
        id: signing
        env:
          EXISTING_KEY_BASE64: ${{ secrets.TRADE_REVIEW_KEYSTORE_BASE64 }}
          EXISTING_STORE_PASSWORD: ${{ secrets.TRADE_REVIEW_KEYSTORE_PASSWORD }}
          EXISTING_KEY_ALIAS: ${{ secrets.TRADE_REVIEW_KEY_ALIAS }}
          EXISTING_KEY_PASSWORD: ${{ secrets.TRADE_REVIEW_KEY_PASSWORD }}
        run: |
          configured=$(python3 scripts/signing-config-state.py)
          if [ "$configured" = true ]; then
            umask 077
            key_path="$RUNNER_TEMP/trade-review-existing.keystore"
            printf '%s' "$EXISTING_KEY_BASE64" | base64 --decode > "$key_path"
            printf 'TRADE_REVIEW_KEYSTORE_PATH=%s\n' "$key_path" >> "$GITHUB_ENV"
            printf 'TRADE_REVIEW_KEYSTORE_PASSWORD=%s\n' "$EXISTING_STORE_PASSWORD" >> "$GITHUB_ENV"
            printf 'TRADE_REVIEW_KEY_ALIAS=%s\n' "$EXISTING_KEY_ALIAS" >> "$GITHUB_ENV"
            printf 'TRADE_REVIEW_KEY_PASSWORD=%s\n' "$EXISTING_KEY_PASSWORD" >> "$GITHUB_ENV"
            printf 'configured=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'configured=false\n' >> "$GITHUB_OUTPUT"
          fi
      - name: Compile, run JVM tests and Android lint
        run: ./gradlew --no-daemon --no-build-cache --stacktrace :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:lintDebug
      - name: Verify compiled APK identity, V0.6 version and offline permissions
        run: |
          apk_path=app/build/outputs/apk/debug/app-debug.apk
          aapt_path="$ANDROID_HOME/build-tools/35.0.0/aapt"
          badging=$("$aapt_path" dump badging "$apk_path")
          apk_identity=${badging%%$'\n'*}
          printf '%s\n' "$apk_identity"
          [[ "$apk_identity" == *"package: name='com.tradereview.app' versionCode='6' versionName='0.6.0'"* ]] || exit 1
          permissions=$("$aapt_path" dump permissions "$apk_path")
          if [[ "$permissions" == *"android.permission.INTERNET"* ]]; then
            printf 'Offline APK unexpectedly requests INTERNET; publication refused\n' >&2
            exit 1
          fi
          mkdir -p dist
          printf '%s\n%s\n' "$apk_identity" "$permissions" > dist/APK-IDENTITY.txt
      - name: Verify fixed signer certificate pin or label APK as temporary test
        id: signature
        env:
          TRADE_REVIEW_EXISTING_KEY_CONFIGURED: ${{ steps.signing.outputs.configured }}
          TRADE_REVIEW_UPGRADE_CERT_SHA256: ${{ vars.TRADE_REVIEW_UPGRADE_CERT_SHA256 }}
        run: bash scripts/check-apk-signature.sh app/build/outputs/apk/debug/app-debug.apk
      - name: Remove temporary existing key
        if: always()
        run: rm -f "$RUNNER_TEMP/trade-review-existing.keystore"
      - name: Verify explicitly supplied public fixed-signed APK against this build
        if: github.event_name == 'workflow_dispatch' && inputs.signed_apk_blob_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED_APK_BLOB_SHA: ${{ inputs.signed_apk_blob_sha }}
        run: |
          [[ "$SIGNED_APK_BLOB_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/$SIGNED_APK_BLOB_SHA" > "$RUNNER_TEMP/public-apk-blob.json"
          python3 scripts/adopt-signed-apk.py \
            --blob-file "$RUNNER_TEMP/public-apk-blob.json" --blob-sha "$SIGNED_APK_BLOB_SHA" \
            --compiled-apk app/build/outputs/apk/debug/app-debug.apk \
            --apksigner "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            --expected-cert-file docs/V03-CERTIFICATE-SHA256.txt --output-dir dist \
            --source-commit "$GITHUB_SHA" --secrets-configured '${{ steps.signing.outputs.configured }}'
      - name: Upload debug APK
        id: apk
        uses: actions/upload-artifact@v4
        with:
          name: TradeReview-v0.6-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Upload complete Gradle wrapper
        if: always() && hashFiles('gradle/wrapper/gradle-wrapper.jar') != ''
        uses: actions/upload-artifact@v4
        with:
          name: gradle-wrapper
          path: |
            gradlew
            gradlew.bat
            gradle/wrapper/
          retention-days: 30
      - name: Upload test, lint and Room schema reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            app/build/reports/
            app/build/test-results/
            app/schemas/
          retention-days: 30

  device-tests:
    name: Room upgrades, v1–v6 upgrades, evidence, ZIP, reports, goals, risk, R and Compose UI
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    steps:
      - name: Reserve disk space for the disposable emulator
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet
          df -h /
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: true
      - name: Download verified wrapper from build job
        uses: actions/download-artifact@v4
        with:
          name: gradle-wrapper
      - name: Download generated Room schemas from build job
        uses: actions/download-artifact@v4
        with:
          name: verification-reports
          path: ci-reports
      - name: Install generated schemas as migration test assets
        run: cp -R ci-reports/schemas/. app/schemas/
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          chmod +x gradlew
      - name: Run Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics -partition-size 2048
          disable-animations: true
          script: bash scripts/run-device-tests.sh
      - name: Upload real emulator screenshots from synthetic UI fixtures
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: v06-emulator-screenshots
          path: ci-screenshots/
          if-no-files-found: error
          retention-days: 30
      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/androidTest-additional-output/
            ci-screenshots/
          retention-days: 30

  publish:
    name: Publish verified V0.6 APK with explicit signing status
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: [build, device-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: TradeReview-v0.6-${{ github.run_number }}
          path: dist
      - name: Download verified emulator screenshots
        uses: actions/download-artifact@v4
        with:
          name: v06-emulator-screenshots
          path: screenshots
      - name: Package synthetic UI screenshots
        run: zip -r dist/TradeReview-v0.6-emulator-screenshots.zip screenshots
      - name: Publish after all verification jobs pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v06-debug-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [ -f dist/TradeReview-v0.6-stable.apk ]; then
            title="交易复盘 V0.6 · 固定签名 Debug 包"
            notes="Debug 编译、JVM 单元测试、Lint、Room 迁移/事务恢复、快速录入/标签/品种/草稿、日历/筛选/分币种统计、图片/完整 ZIP/周月报告/改善目标及 Compose 模拟器测试均通过。固定签名已验证证书 pin，真实签名来源和 Secrets 配置状态见 SIGNING.txt；若 Secrets 尚未配置，仓库所有者仍需完成配置才能自动签署未来更新。后续必须使用相同私钥和更大 versionCode。旧测试版不同签名时需手动卸载。模拟器测试不是手机实测。"
          else
            title="交易复盘 V0.6 · 临时签名测试包"
            notes="Debug 编译、JVM 单元测试、Lint、Room 迁移/事务恢复、快速录入/标签/品种/草稿、日历/筛选/分币种统计、图片/完整 ZIP/周月报告/改善目标及 Compose 模拟器测试均通过。固定签名 Secrets 未配置，此包不保证未来长期覆盖升级。此临时包不能覆盖安装固定签名 V0.3；请先 JSON 备份，确认后自行处理不同签名的旧版安装，卸载会清空本地数据。V0.6 数据请定期备份。模拟器测试不是手机实测。"
          fi
          printf '%s\n' "$notes" > "$RUNNER_TEMP/release-notes.txt"
          gh release create "$tag" dist/*.apk dist/SHA256SUMS.txt dist/SIGNING.txt dist/APK-IDENTITY.txt dist/TradeReview-v0.6-emulator-screenshots.zip --repo "$GITHUB_REPOSITORY" --target "${{ github.event.pull_request.head.sha || github.sha }}" --title "$title" --prerelease --notes-file "$RUNNER_TEMP/release-notes.txt"
          printf '[APK 与真实验证结果](https://github.com/%s/releases/tag/%s)\n' "$GITHUB_REPOSITORY" "$tag" >> "$GITHUB_STEP_SUMMARY"
