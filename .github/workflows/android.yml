name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      signed_apk_blob_sha:
        description: 'Optional public fixed-signed APK Git blob; payload and signer must match this build and committed pin'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: android-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Debug APK, unit tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      validation_ready: ${{ steps.compilation.outcome == 'success' }}
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      - name: Generate official wrapper when absent
        if: ${{ hashFiles('gradle/wrapper/gradle-wrapper.jar') == '' }}
        run: bash scripts/generate-wrapper.sh
      - name: Validate official wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Test signature publication guards without private keys
        run: |
          python3 scripts/tests/test_signing_guard.py
          python3 scripts/tests/test_signing_config.py
          python3 scripts/tests/test_signed_payload.py
          python3 scripts/tests/test_device_delivery.py
          python3 scripts/tests/test_publication.py
          python3 scripts/tests/test_stability_probes.py
      - name: Compile, run JVM tests and Android lint
        id: compilation
        run: ./gradlew --no-daemon --no-build-cache --stacktrace :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:lintDebug
      - name: Verify compiled APK identity, bundled OCR models, V0.8 version and offline permissions
        run: |
          apk_path=app/build/outputs/apk/debug/app-debug.apk
          aapt_path="$ANDROID_HOME/build-tools/35.0.0/aapt"
          badging=$("$aapt_path" dump badging "$apk_path")
          apk_identity=${badging%%$'\n'*}
          printf '%s\n' "$apk_identity"
          [[ "$apk_identity" == *"package: name='com.tradereview.app' versionCode='8' versionName='0.8.0'"* ]] || exit 1
          permissions=$("$aapt_path" dump permissions "$apk_path")
          if [[ "$permissions" == *"android.permission.INTERNET"* || "$permissions" == *"android.permission.READ_EXTERNAL_STORAGE"* || "$permissions" == *"android.permission.WRITE_EXTERNAL_STORAGE"* || "$permissions" == *"android.permission.READ_MEDIA_"* || "$permissions" == *"android.permission.MANAGE_EXTERNAL_STORAGE"* ]]; then
            printf 'Offline APK unexpectedly requests INTERNET; publication refused\n' >&2
            exit 1
          fi
          python3 - "$apk_path" <<'PYMODEL'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as apk:
              names=apk.namelist()
              for script in ("Hani_ctc", "Latn_ctc"):
                  assert any(script in n and n.endswith("conv_model.fb") for n in names), "Bundled OCR model missing: " + script
          PYMODEL
          mkdir -p dist
          printf '%s\n%s\n' "$apk_identity" "$permissions" > dist/APK-IDENTITY.txt
      - name: Configure fixed V0.3 signing key from Secrets when available
        id: signing
        env:
          EXISTING_KEY_BASE64: ${{ secrets.TRADE_REVIEW_KEYSTORE_BASE64 }}
          EXISTING_STORE_PASSWORD: ${{ secrets.TRADE_REVIEW_KEYSTORE_PASSWORD }}
          EXISTING_KEY_ALIAS: ${{ secrets.TRADE_REVIEW_KEY_ALIAS }}
          EXISTING_KEY_PASSWORD: ${{ secrets.TRADE_REVIEW_KEY_PASSWORD }}
        run: |
          configured=$(python3 scripts/signing-config-state.py)
          if [ "$configured" = true ]; then
            umask 077
            key_path="$RUNNER_TEMP/trade-review-existing.keystore"
            printf '%s' "$EXISTING_KEY_BASE64" | base64 --decode > "$key_path"
            printf 'TRADE_REVIEW_KEYSTORE_PATH=%s\n' "$key_path" >> "$GITHUB_ENV"
            printf 'TRADE_REVIEW_KEYSTORE_PASSWORD=%s\n' "$EXISTING_STORE_PASSWORD" >> "$GITHUB_ENV"
            printf 'TRADE_REVIEW_KEY_ALIAS=%s\n' "$EXISTING_KEY_ALIAS" >> "$GITHUB_ENV"
            printf 'TRADE_REVIEW_KEY_PASSWORD=%s\n' "$EXISTING_KEY_PASSWORD" >> "$GITHUB_ENV"
            printf 'configured=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'configured=false\n' >> "$GITHUB_OUTPUT"
          fi
      - name: Sign compiled payload with existing key only after independent validation
        if: steps.signing.outputs.configured == 'true'
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$TRADE_REVIEW_KEYSTORE_PATH" --ks-key-alias "$TRADE_REVIEW_KEY_ALIAS" --ks-pass env:TRADE_REVIEW_KEYSTORE_PASSWORD --key-pass env:TRADE_REVIEW_KEY_PASSWORD app/build/outputs/apk/debug/app-debug.apk
      - name: Verify fixed signer certificate pin or label APK as temporary test
        id: signature
        env:
          TRADE_REVIEW_EXISTING_KEY_CONFIGURED: ${{ steps.signing.outputs.configured }}
          TRADE_REVIEW_UPGRADE_CERT_SHA256: ${{ vars.TRADE_REVIEW_UPGRADE_CERT_SHA256 }}
        run: bash scripts/check-apk-signature.sh app/build/outputs/apk/debug/app-debug.apk
      - name: Remove temporary existing key
        if: always()
        run: rm -f "$RUNNER_TEMP/trade-review-existing.keystore"
      - name: Verify explicitly supplied public fixed-signed APK against this build
        if: github.event_name == 'workflow_dispatch' && inputs.signed_apk_blob_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED_APK_BLOB_SHA: ${{ inputs.signed_apk_blob_sha }}
        run: |
          [[ "$SIGNED_APK_BLOB_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/$SIGNED_APK_BLOB_SHA" > "$RUNNER_TEMP/public-apk-blob.json"
          python3 scripts/adopt-signed-apk.py \
            --blob-file "$RUNNER_TEMP/public-apk-blob.json" --blob-sha "$SIGNED_APK_BLOB_SHA" \
            --compiled-apk app/build/outputs/apk/debug/app-debug.apk \
            --apksigner "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            --expected-cert-file docs/V03-CERTIFICATE-SHA256.txt --output-dir dist \
            --source-commit "$GITHUB_SHA" --secrets-configured '${{ steps.signing.outputs.configured }}'
      - name: Upload debug APK
        id: apk
        uses: actions/upload-artifact@v4
        with:
          name: TradeReview-v0.8-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Prepare bounded verification copies for the Base file tool
        run: |
          python3 - <<'PYPARTS'
          from pathlib import Path
          apk = next(Path('dist').glob('*.apk'))
          out = Path('apk-verification'); out.mkdir()
          with apk.open('rb') as source:
              for index in range(1, 10):
                  chunk = source.read(24 * 1024 * 1024)
                  if not chunk:
                      break
                  (out / f'part-{index:02}.bin').write_bytes(chunk)
          assert not (out / 'part-07.bin').exists(), 'APK verification copies exceed 144 MiB bound'
          (out / 'original-apk-name.txt').write_text(apk.name + '\n', encoding='utf-8')
          PYPARTS
      - name: Upload signature metadata for independent verification
        uses: actions/upload-artifact@v4
        with:
          name: signing-metadata
          path: |
            dist/*.txt
            apk-verification/original-apk-name.txt
          if-no-files-found: error
          retention-days: 30
      - name: Upload bounded verification part 1
        uses: actions/upload-artifact@v4
        with:
          name: apk-verification-part-1
          path: apk-verification/part-01.bin
          if-no-files-found: error
          retention-days: 30
      - name: Upload bounded verification part 2
        if: hashFiles('apk-verification/part-02.bin') != ''
        uses: actions/upload-artifact@v4
        with:
          name: apk-verification-part-2
          path: apk-verification/part-02.bin
          if-no-files-found: error
          retention-days: 30
      - name: Upload bounded verification part 3
        if: hashFiles('apk-verification/part-03.bin') != ''
        uses: actions/upload-artifact@v4
        with:
          name: apk-verification-part-3
          path: apk-verification/part-03.bin
          if-no-files-found: error
          retention-days: 30
      - name: Upload bounded verification part 4
        if: hashFiles('apk-verification/part-04.bin') != ''
        uses: actions/upload-artifact@v4
        with:
          name: apk-verification-part-4
          path: apk-verification/part-04.bin
          if-no-files-found: error
          retention-days: 30
      - name: Upload bounded verification part 5
        if: hashFiles('apk-verification/part-05.bin') != ''
        uses: actions/upload-artifact@v4
        with:
          name: apk-verification-part-5
          path: apk-verification/part-05.bin
          if-no-files-found: error
          retention-days: 30
      - name: Upload bounded verification part 6
        if: hashFiles('apk-verification/part-06.bin') != ''
        uses: actions/upload-artifact@v4
        with:
          name: apk-verification-part-6
          path: apk-verification/part-06.bin
          if-no-files-found: error
          retention-days: 30
      - name: Upload complete Gradle wrapper
        if: always() && hashFiles('gradle/wrapper/gradle-wrapper.jar') != ''
        uses: actions/upload-artifact@v4
        with:
          name: gradle-wrapper
          path: |
            gradlew
            gradlew.bat
            gradle/wrapper/
          retention-days: 30
      - name: Upload test, lint and Room schema reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            app/build/reports/
            app/build/test-results/
            app/schemas/
          retention-days: 30

  device-tests:
    name: API ${{ matrix.api }} · Room, OCR, data, UI and performance
    runs-on: ubuntu-latest
    needs: build
    # Run after a signing failure, but allow obsolete runs to be cancelled.
    if: ${{ !cancelled() && needs.build.outputs.validation_ready == 'true' }}
    env:
      V08_STABILITY_PROBES: 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 29
            target: google_apis
          - api: 35
            target: default
    timeout-minutes: 35
    steps:
      - name: Reserve disk space for the disposable emulator
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet
          df -h /
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: true
      - name: Download verified wrapper from build job
        uses: actions/download-artifact@v4
        with:
          name: gradle-wrapper
      - name: Download generated Room schemas from build job
        uses: actions/download-artifact@v4
        with:
          name: verification-reports
          path: ci-reports
      - name: Install generated schemas as migration test assets
        run: cp -R ci-reports/schemas/. app/schemas/
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          chmod +x gradlew
      - name: Run Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -feature -Vulkan -memory 3072 -cores 2 -no-snapshot -noaudio -no-boot-anim -no-metrics -partition-size 2048
          disable-animations: true
          script: bash scripts/run-device-tests.sh
      - name: Upload real emulator screenshots from synthetic UI fixtures
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: v08-emulator-screenshots-api${{ matrix.api }}
          path: ci-screenshots/
          if-no-files-found: error
          retention-days: 30
      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports-api${{ matrix.api }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/androidTest-additional-output/
            ci-screenshots/
            ci-metrics/
            ci-stability/
          retention-days: 30

  publish:
    name: Publish verified V0.8 APK with explicit signing status
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: [build, device-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'build-tools;35.0.0'
      - uses: actions/download-artifact@v4
        with:
          name: TradeReview-v0.8-${{ github.run_number }}
          path: dist
      - name: Download verified emulator screenshots
        uses: actions/download-artifact@v4
        with:
          pattern: v08-emulator-screenshots-api*
          path: screenshots
      - name: Package synthetic UI screenshots
        run: zip -r dist/TradeReview-v0.8-emulator-screenshots.zip screenshots
      - name: Download actual build reports
        uses: actions/download-artifact@v4
        with:
          name: verification-reports
          path: verified-reports/build
      - name: Download actual API 29 and 35 reports
        uses: actions/download-artifact@v4
        with:
          pattern: android-test-reports-api*
          path: verified-reports/devices
      - name: Independently verify final APK signer, original identity, SHA and source
        run: python3 scripts/verify-publication.py --directory dist --apksigner "$ANDROID_HOME/build-tools/35.0.0/apksigner" --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt" --source-commit "$GITHUB_SHA"
      - name: Generate delivery report from actual XML and synthetic metrics
        run: python3 scripts/create-delivery-report.py --reports verified-reports --screenshots screenshots --dist dist --run-url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Publish after all verification jobs pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v08-debug-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [ -f dist/TradeReview-v0.8-stable.apk ]; then
            title="交易复盘 V0.8 · 固定签名 Debug 包"
            notes="V0.8.0 / versionCode 8 / com.tradereview.app。Debug 编译、JVM 单元测试、Lint、API 29/35 完整模拟器回归与实际进程重启探针均通过；具体测试、性能及合成 OCR 结果见 CI-RESULTS.txt、PERFORMANCE-AND-OCR.json。固定签名已验证原 V0.3 证书 pin，实际证书、来源、升级分类见 SIGNING.txt、PUBLICATION-CHECK.txt；若 Secrets 尚未配置，所有者仍需配置原密钥才能自动签署未来更新。后续保持相同私钥及递增 versionCode。不同证书不能覆盖安装；先保存可读的完整 ZIP（包含截图），由所有者决定迁移方式。备份是明文。模拟器不是手机实测，原固定身份旧版安装升级及厂家兼容尚未验证。"
          else
            title="交易复盘 V0.8 · 临时签名测试包"
            notes="V0.8.0 / versionCode 8 / com.tradereview.app。Debug 编译、JVM 单元测试、Lint、API 29/35 完整模拟器回归与实际进程重启探针均通过；具体测试、性能及合成 OCR 结果见 CI-RESULTS.txt、PERFORMANCE-AND-OCR.json。固定签名未配置成功，此包明确为临时测试身份，不保证长期覆盖升级、不能覆盖原 V0.3 固定身份；实际证书、SHA-256 和来源见 SIGNING.txt、SHA256SUMS.txt、PUBLICATION-CHECK.txt。先保存可读的完整 ZIP（包含截图），由所有者决定不同签名的安装迁移；卸载会清空本机数据。仅 JSON 不含图片。备份是明文。模拟器不是手机实测，真正固定签名旧版升级、厂家兼容和 API36 尚未验证。"
          fi
          printf '%s\n' "$notes" > "$RUNNER_TEMP/release-notes.txt"
          cat dist/CI-RESULTS.txt >> "$RUNNER_TEMP/release-notes.txt"
          gh release create "$tag" dist/*.apk dist/SHA256SUMS.txt dist/SIGNING.txt dist/APK-IDENTITY.txt dist/PUBLICATION-CHECK.txt dist/CI-RESULTS.txt dist/PERFORMANCE-AND-OCR.json dist/TradeReview-v0.8-emulator-screenshots.zip --repo "$GITHUB_REPOSITORY" --target "${{ github.event.pull_request.head.sha || github.sha }}" --title "$title" --prerelease --notes-file "$RUNNER_TEMP/release-notes.txt"
          printf '[APK 与真实验证结果](https://github.com/%s/releases/tag/%s)\n' "$GITHUB_REPOSITORY" "$tag" >> "$GITHUB_STEP_SUMMARY"
