name: Android CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Debug APK, unit tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Generate official wrapper when absent
        if: ${{ hashFiles('gradle/wrapper/gradle-wrapper.jar') == '' }}
        run: bash scripts/generate-wrapper.sh
      - name: Validate official wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Restore debug signing key for consistent updates
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: trade-review-debug-keystore-v1
      - name: Compile, run JVM tests and Android lint
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - name: Prepare downloadable APK and checksum
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/TradeReview-debug.apk
          cd dist
          sha256sum TradeReview-debug.apk > SHA256SUMS.txt
      - name: Upload debug APK
        id: apk
        uses: actions/upload-artifact@v4
        with:
          name: TradeReview-debug-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Upload complete Gradle wrapper
        if: always() && hashFiles('gradle/wrapper/gradle-wrapper.jar') != ''
        uses: actions/upload-artifact@v4
        with:
          name: gradle-wrapper
          path: |
            gradlew
            gradlew.bat
            gradle/wrapper/
          retention-days: 30
      - name: Upload test, lint and Room schema reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            app/build/reports/
            app/build/test-results/
            app/schemas/
          retention-days: 30
      - name: Commit generated wrapper and Room schema to the source branch
        if: github.event_name == 'push' && startsWith(github.ref_name, 'codex/')
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gradlew gradlew.bat gradle/wrapper/ app/schemas/
          if ! git diff --cached --quiet; then
            git commit -m 'build: add verified Gradle wrapper and Room schema'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Publish APK for mobile browser download
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="debug-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" dist/TradeReview-debug.apk dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$(git rev-parse HEAD)" \
            --title "交易复盘 Debug · 构建 ${GITHUB_RUN_NUMBER}" --prerelease \
            --notes '原生 Android 离线 MVP。用安卓浏览器登录此仓库的 GitHub 账号，打开 Assets 下载 TradeReview-debug.apk。调试版仅供试用；所有交易保存在手机本地，卸载会删除数据。此 APK 已完成 JVM 测试及 Lint；模拟器结果请查看同次 Actions 运行。'
          release_url="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}"
          printf '### Android Debug APK\n\n[手机浏览器直接下载 APK](%s)\n\n[Actions APK 产物](%s)\n\n模拟器测试请查看本次运行的另一项任务。\n' "$release_url" '${{ steps.apk.outputs.artifact-url }}' >> "$GITHUB_STEP_SUMMARY"

  device-tests:
    name: Room persistence and Compose navigation
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Download verified wrapper from build job
        uses: actions/download-artifact@v4
        with:
          name: gradle-wrapper
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          chmod +x gradlew
      - name: Run Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: ./gradlew --no-daemon --stacktrace :app:connectedDebugAndroidTest
      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 30
